name: mem0_oss
version: 1.0.0
type: memory_provider
description: >
  Shared AI501 troubleshooting memory for Hermie, backed by self-hosted Mem0.
homepage: https://github.com/nousresearch/hermes-agent
env_vars:
  - key: MEM0_URL
    description: "Base URL of your self-hosted Mem0 server (e.g. https://mem0-server.apps.example.com)"
    secret: false
    required: true
  - key: MEM0_AGENT_ID
    description: "Shared AI501 collection identifier (default: hermie)"
    secret: false
    required: false
  - key: MEM0_CUSTOM_INSTRUCTIONS
    description: "Optional instructions appended to the AI501 troubleshooting extraction prompt"
    secret: false
    required: false
